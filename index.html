<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiriySuuu - Slay Korean Edition ✨</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    
    <link rel="icon" href="https://fav.farm/💖" />

    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>
        window.addEventListener('load', function() {
            if (typeof eruda !== 'undefined') {
                eruda.init();
                
                // Eruda butonunu (çarkı) özelleştiren stil enjeksiyonu ⚙️💉
                const style = document.createElement('style');
                style.innerHTML = `
                    .eruda-entry-btn {
                        right: 20px !important;
                        bottom: 80px !important;
                        width: 45px !important;
                        height: 45px !important;
                        background-color: #ff69b4 !important; /* MiriySuuu Pembesi 💖 */
                        border-radius: 50% !important;
                        opacity: 0.8 !important;
                        box-shadow: 0 4px 15px rgba(255, 105, 180, 0.5) !important;
                        display: flex !important;
                        align-items: center !important;
                        justify-content: center !important;
                    }
                `;
                document.head.appendChild(style);
            }
        });
    </script>
</head>
<body>

    <header>
        <h1>💖 MiriySuuu 💖</h1>
        <p>Korece Öğren be Ask! ✨</p>
    </header>

    <main>
        <section class="search-container">
            <div class="search-wrapper" style="position: relative; width: 100%; max-width: 600px; margin: 0 auto;">
                <input type="text" id="searchInput" placeholder="Kelime ara... ✨">
                <div id="autocomplete-list" class="autocomplete-items"></div>
            </div>
        </section>

        <section id="categoryButtons" class="category-filters"></section>

        <section class="word-grid" id="wordGrid"></section>
    </main>

    <footer>
        <p>Slayy All Day with Miriy 👑</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
